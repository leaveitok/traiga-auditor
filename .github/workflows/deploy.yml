name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: traiga-auditor
  REGION: us-central1
  SERVICE: ai-transparency-auditor-api
  REGISTRY: us-central1-docker.pkg.dev
  AR_REPO: ai-transparency-auditor
  IMAGE: api

jobs:
  # ── CI GATE ─────────────────────────────────────────────────────────────────
  # Runs the backend test suite on every push. The deploy job below depends on
  # this ("needs: test"), so a single failing test BLOCKS the deploy — production
  # stays on the last known-good revision. This is the server-side enforcement of
  # the same pytest gate the local ship_*.bat runs, so it can never be skipped.
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest tests/ -q

  deploy:
    name: Build & Deploy
    needs: test          # ← deploy is gated: it only runs if "test" succeeded
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE }}:${{ github.sha }} \
            ./backend

      - name: Push Docker image
        run: |
          docker push --all-tags \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE }}

      # HARDENING (learned the hard way): gcloud --env-vars-file parses this as YAML and
      # rejects any NON-STRING value with exit code 2. An UNQUOTED value gets coerced —
      # 01.6 -> float, 24 -> int, true -> bool, empty -> null — which silently broke the
      # backend deploy for six releases. RULE: QUOTE EVERY VALUE. The next step verifies it.
      - name: Write env.yaml
        run: |
          {
            echo 'GOOGLE_SERVICE_ACCOUNT_FILE: "/secrets/service_account.json"'
            echo 'SPREADSHEET_ID: "1kWpfVMu1GhPRU5xNBQxqu2t12h6vSfrWZufNPHUNYHk"'
            echo 'FIREBASE_PROJECT_ID: "traiga-auditor"'
            echo 'ADMIN_EMAILS: "leaveitok@gmail.com"'
            echo 'REQUIRE_AUTH: "true"'
            echo 'CORS_ORIGINS: "https://traiga-auditor.web.app,https://traiga-auditor.firebaseapp.com"'
            echo 'SCAN_CADENCE_HOURS: "24"'
            echo 'API_HOST: "0.0.0.0"'
            echo 'SCAN_PROXY_ONLY_FLAGGED: "true"'
            echo 'GOVERNANCE_STORE: "firestore"'
            echo 'SENTINEL_STORE: "firestore"'
            echo 'FIRESTORE_SENTINEL_DB: "traiga-sentinel"'
            echo 'GIT_SHA: "${{ github.sha }}"'
            echo "APP_RELEASE: \"$(cat VERSION 2>/dev/null || echo dev)\""
          } > deploy/env.yaml

      - name: Validate env.yaml (every value must be a quoted string)
        run: |
          # Fail loudly BEFORE gcloud if any value is not wrapped in double quotes, so an
          # unquoted-coercion bug can never silently reach Cloud Run again. Dependency-free.
          if grep -nE '^[A-Za-z_][A-Za-z0-9_]*:[[:space:]]*[^"[:space:]]' deploy/env.yaml; then
            echo "::error::Unquoted value(s) in deploy/env.yaml (listed above). YAML coerces 01.6->float, 24->int, true->bool; gcloud then rejects it. Wrap every value in double quotes."
            exit 1
          fi
          echo "OK: every env.yaml value is a quoted string."

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --no-cpu-throttling \
            --env-vars-file=deploy/env.yaml \
            --set-secrets=/secrets/service_account.json=traiga-service-account:latest,SCAN_PROXY_URL=traiga-scan-proxy:latest,SENTINEL_INGEST_TOKENS=traiga-sentinel-tokens:latest,SCHEDULER_TOKEN=traiga-scheduler-token:latest \
            --memory=2Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300 \
            --concurrency=80 \
            --session-affinity \
            --project=${{ env.PROJECT_ID }} \
            --quiet
